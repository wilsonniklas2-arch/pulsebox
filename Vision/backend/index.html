<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBox | Live Command Center</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #05050a;
            --card-bg: #0f1019;
            --accent-neon: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b8ea5;
            --border-color: #1a1c29;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-neon);
            text-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--accent-neon);
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .track-info h3 {
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .track-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .vote-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .vote-count {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-neon);
        }

        button.vote-btn {
            background: var(--accent-neon);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: transform 0.1s ease;
        }

        button.vote-btn:active {
            transform: scale(0.95);
        }

        .playlist-box {
            background: rgba(15, 16, 25, 0.5);
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            font-size: 0.850rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎛️ PulseBox Live</h1>
            <p>Autonomes Musik-Command-Center</p>
        </header>

        <!-- AKTUELLES VOTING -->
        <div class="section-title">🔥 Aktives Voting (Top 3)</div>
        <div id="voting-container">
            <!-- Wird dynamisch geladen -->
        </div>

        <!-- WARTELISTE: WAS KOMMT & WAS WAR -->
        <div class="section-title">⏳ Warteliste & Historie</div>
        <div id="playlist-container">
            <div class="playlist-box"><span>Nächster Track:</span> <b style="color:#fff;">Samba Speed (VIP Mix)</b></div>
            <div class="playlist-box"><span>Zuletzt gespielt:</span> <b style="color:#fff;">Industrial Chaos</b></div>
        </div>
    </div>

    <script>
        const socket = io();

        // Beispiel-Datenstruktur für das Live-Rendering
        const tracks = [
            { id: 1, title: "Industrial Chaos", artist: "DarkTec", votes: 1 },
            { id: 2, title: "Samba Speed", artist: "Van Harden", votes: 0 },
            { id: 3, title: "Kebab Kontinuum", artist: "PulseBox Crew", votes: 0 }
        ];

        function renderTracks() {
            const container = document.getElementById('voting-container');
            container.innerHTML = '';
            tracks.forEach(track => {
                container.innerHTML += `
                    <div class="card">
                        <div class="track-info">
                            <h3>${track.title}</h3>
                            <p>${track.artist}</p>
                        </div>
                        <div class="vote-section">
                            <span class="vote-count">${track.votes}</span>
                            <button class="vote-btn" onclick="vote(${track.id})">Vote</button>
                        </div>
                    </div>
                `;
            });
        }

        function vote(id) {
            const track = tracks.find(t => t.id === id);
            if(track) {
                track.votes++;
                renderTracks();
                // Hier schicken wir später den Socket-Befehl ab
            }
        }

        renderTracks();
    </script>
</body>
</html>
